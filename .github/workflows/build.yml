name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: Build Headroom.exe
        run: |
          mkdir -p dist/Headroom
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/Headroom/Headroom.exe .
          cp README.md LICENSE dist/Headroom/
          cd dist && zip -qr Headroom.zip Headroom

      - uses: actions/upload-artifact@v4
        with:
          name: Headroom
          path: dist/Headroom/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Headroom/Headroom.exe
            dist/Headroom.zip
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          generate_release_notes: true
