name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to see existing tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: Build Headroom.exe
        run: |
          mkdir -p dist/Headroom
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/Headroom/Headroom.exe .
          cp README.md LICENSE dist/Headroom/
          cd dist && zip -qr Headroom.zip Headroom

      - uses: actions/upload-artifact@v4
        with:
          name: Headroom
          path: dist/Headroom/

      # Release whenever VERSION on main names a version without a tag yet.
      - name: Check version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          # edited release notes also refresh the existing release
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -q '^.github/release-notes.md$'; then
            echo "notes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.version.outputs.new == 'true' || steps.version.outputs.notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Headroom ${{ steps.version.outputs.tag }}
          files: |
            dist/Headroom/Headroom.exe
            dist/Headroom.zip
          body_path: .github/release-notes.md
          prerelease: ${{ contains(steps.version.outputs.tag, 'beta') }}
